name: Build Animal Company Menu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          cd "$RUNNER_TEMP/gradle"
          curl -fsSLo gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gradle/gradle-8.2/bin/gradle" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimalCompanyMenu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
